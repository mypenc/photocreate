name: iOS IPA

on:
  push:
    branches:
      - main
      - android-port
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust 1.95 with iOS device target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-arm64
          cache-on-failure: true

      - name: Build photocreate-ios (release)
        run: |
          set -o pipefail
          cargo build --release --target aarch64-apple-ios -p photocreate-ios 2>&1 | tee /tmp/build.log

      # Build the .app by hand: no Xcode project needed.
      - name: Assemble PhotoCreate.app
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          BUILD=$(( 1000 + ${{ github.run_number }} ))
          APP=build/Payload/PhotoCreate.app
          rm -rf build && mkdir -p "$APP"
          cp target/aarch64-apple-ios/release/photocreate-ios "$APP/photocreate-ios"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__BUILD__/$BUILD/" packaging/ios/Info.plist > "$APP/Info.plist"
          printf 'APPL????' > "$APP/PkgInfo"
          # Icons: 120 px (60 pt @2x) for iPhone and 152 px (76 pt @2x) for iPad.
          sips -z 120 120 assets/app-icon/photocraft-1024.png --out "$APP/AppIcon60x60@2x.png"
          sips -z 152 152 assets/app-icon/photocraft-1024.png --out "$APP/AppIcon76x76@2x.png"
          plutil -lint "$APP/Info.plist"

      # Signing is optional. Without secrets the IPA is UNSIGNED: install it with AltStore,
      # Sideloadly or TrollStore (they re-sign it with your Apple ID).
      # Secrets for a signed build: IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROVISION_PROFILE_BASE64.
      - name: Sign (if certificate secrets are set)
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          APP=build/Payload/PhotoCreate.app
          if [ -z "${CERT_B64:-}" ] || [ -z "${PROFILE_B64:-}" ]; then
            echo "::warning::No iOS signing secrets set; the IPA is unsigned (sideload it with AltStore / Sideloadly)."
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | head -n1 | sed 's/.*"\(.*\)".*/\1/')
          codesign --force --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/entitlements.plist" --timestamp=none "$APP"
          codesign --verify --verbose "$APP"

      - name: Package IPA
        id: ipa
        run: |
          set -euo pipefail
          cd build
          zip -qry PhotoCreate.ipa Payload
          ls -lh PhotoCreate.ipa
          echo "path=build/PhotoCreate.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: photocreate-ios-ipa
          path: ${{ steps.ipa.outputs.path }}

      - name: Create GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ipa.outputs.path }}

      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/push-log.sh ios /tmp/build.log
